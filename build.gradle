plugins {
    // Minecraft 26.x uses the new `net.fabricmc.fabric-loom` plugin. Unlike the
    // old `fabric-loom`/`fabric-loom-remap` plugins it does NOT remap Minecraft
    // or mods — the game is developed directly against Mojang's names, so there
    // is no separate `mappings` dependency (see the dependencies block below).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Most third-party Fabric mods (Sodium, Iris, ModMenu, …) publish to
    // Modrinth's and/or Maven Central. We only need these for *optional*
    // compile-time integration; FluxLogic has no hard dependency on them.
    maven { url = 'https://api.modrinth.com/maven' }       // Modrinth mods
    maven { url = 'https://maven.terraformersmc.com/' }    // Mod Menu
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // NOTE: no `mappings` line. The new no-remap Loom for 26.x develops directly
    // against Mojang's names; adding `loom.officialMojangMappings()` here is what
    // triggers "Failed to find official mojang mappings for 26.2".

    // Plain `implementation` (not `modImplementation`) — with no remap step the
    // mod dependencies don't need Loom's remapping configuration. This mirrors
    // Fabric's official 26.2 example mod.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ---- OPTIONAL integrations -------------------------------------------
    // Compile against Mod Menu so our config screen shows up in its list, but
    // keep it a soft dependency at runtime (see fabric.mod.json "suggests").
    // Pin a 26.2-compatible build when you wire this in; left commented so a
    // fresh checkout builds without reaching for an exact ModMenu version.
    // implementation "com.terraformersmc:modmenu:VERSION_FOR_26_2"
}

loom {
    // We are a client-only mod. Splitting the source set keeps server-only
    // accidents out of the client jar and documents intent.
    splitEnvironmentSourceSets()

    mods {
        "fluxlogic" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            ideConfigGenerated true
            runDir "run"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_api_version", project.fabric_api_version

    // Inject pinned versions into fabric.mod.json so metadata and gradle
    // never drift apart.
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "loader_version": project.loader_version,
            "fabric_api_version": project.fabric_api_version
        )
    }
}

java {
    // 26.2 requires Java 25. The toolchain block makes Gradle download/select
    // a JDK 25 even if your default `java` is older — see BUILDING.md.
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    }

    // Ship sources so downstream modders can read FluxLogic's hooks.
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = Integer.parseInt(project.java_version)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesName.get()}" }
    }
}
