# ===========================================================================
#  FluxLogic — build properties
#  Target: Minecraft 26.2 "Chaos Cubed" (Java 25), Fabric toolchain.
#
#  Pin everything here so bumping a Minecraft drop is a one-file change.
#  Versions match Fabric's official 26.2 example mod
#  (Loom 1.17-SNAPSHOT, Gradle 9.5.1, Loader 0.19.3, API 0.152.2+26.2).
# ===========================================================================

# Gradle daemon — modern MC builds (decompile + mixin) want headroom.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# IntelliJ's Loom support doesn't yet handle Gradle's configuration cache.
org.gradle.configuration-cache=false

# --- Minecraft / Fabric ----------------------------------------------------
minecraft_version=26.2
# 26.x uses the new no-remap Loom flow: Minecraft is developed directly against
# Mojang's names, so there is NO `mappings` dependency at all (no Yarn, and do
# NOT add loom.officialMojangMappings() — that fails on 26.x). See build.gradle.
loom_version=1.17-SNAPSHOT
loader_version=0.19.3
# Known-good pairing from Fabric's official 26.2 example mod. Bump to the latest
# 26.2 build from https://modrinth.com/mod/fabric-api/versions if you like.
fabric_api_version=0.152.2+26.2

# --- Mod metadata ----------------------------------------------------------
mod_version=0.1.0
maven_group=com.fluxlogic
archives_base_name=fluxlogic

# Minimum Java for 26.2 is 25; toolchain enforces it in build.gradle.
java_version=25
